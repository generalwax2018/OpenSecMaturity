name: Correct a product entry
description: Something about a product, add-on, price tier, or source is wrong or out of date.
title: "Correction: "
labels: [catalog, correction]
body:
  - type: input
    id: product
    attributes:
      label: Product id
      description: The id from catalog/products.json. The "Suggest a correction" link in the app fills this in.
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: What is wrong?
      options:
        - Description or ownership
        - Add-on or pricing
        - FedRAMP or EU residency
        - Strengths or weaknesses
        - Price tier or company size
        - Source link
        - Something else
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should it say?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A public https link that supports the change. Vendor documentation or pricing pages are best.
    validations:
      required: true
  - type: dropdown
    id: affiliation
    attributes:
      label: Do you work for, sell, or resell this product or a competitor?
      options:
        - "No"
        - "Yes, this vendor"
        - "Yes, a competitor"
        - "Yes, a reseller or partner"
    validations:
      required: true

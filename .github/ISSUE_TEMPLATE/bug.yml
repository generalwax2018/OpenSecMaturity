name: Report a bug
description: Something in the app does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please do not paste real company inventory or assessment data.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown under "Check for updates".
  - type: input
    id: browser
    attributes:
      label: Browser and operating system

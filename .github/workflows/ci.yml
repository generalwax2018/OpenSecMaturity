name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Catalog checks
        run: npm run validate:catalog
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Build
        run: npm run build
      - name: Install browser for tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --redact --verbose
